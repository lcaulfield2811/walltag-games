<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WallTag - Snake</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .game-container {
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    canvas {
      background: black;
      border: 3px solid #7a2cff;
      border-radius: 10px;
    }

    #score {
      margin: 10px 0;
      font-size: 18px;
    }

    #backBtn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: #7a2cff;
      border: none;
      color: white;
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
    }

    #backBtn:hover {
      opacity: 0.9;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-size: 20px;
      text-align: center;
    }

    #overlay button {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      background: #7a2cff;
      color: white;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<button id="backBtn">← Back</button>

<div class="game-container">
  <h1>Snake</h1>
  <div id="score">Score: 0</div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
</div>

<div id="overlay">
  <div id="message">
    Press any key to start<br><br>
    Use WASD or Arrow Keys<br>
    Don't hit walls or yourself
  </div>
  <button onclick="startGame()">Start</button>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const gridSize = 20;
const tileCount = canvas.width / gridSize;

let snake, dx, dy, food, score, gameRunning;

// Back button
document.getElementById("backBtn").onclick = () => {
  window.location.href = "index.html"; // change if needed
};

function resetGame() {
  snake = [{ x: 10, y: 10 }];
  dx = 1;
  dy = 0;
  food = {
    x: Math.floor(Math.random() * tileCount),
    y: Math.floor(Math.random() * tileCount)
  };
  score = 0;
  gameRunning = true;
  document.getElementById("score").innerText = "Score: " + score;
}

function startGame() {
  document.getElementById("overlay").style.display = "none";
  resetGame();
}

function gameLoop() {
  if (!gameRunning) return;

  update();
  draw();

  setTimeout(gameLoop, 100);
}

function update() {
  const head = { x: snake[0].x + dx, y: snake[0].y + dy };

  // Wall collision
  if (head.x < 0 || head.y < 0 || head.x >= tileCount || head.y >= tileCount) {
    endGame();
    return;
  }

  // Self collision
  for (let part of snake) {
    if (head.x === part.x && head.y === part.y) {
      endGame();
      return;
    }
  }

  snake.unshift(head);

  // Food
  if (head.x === food.x && head.y === food.y) {
    score++;
    document.getElementById("score").innerText = "Score: " + score;
    food = {
      x: Math.floor(Math.random() * tileCount),
      y: Math.floor(Math.random() * tileCount)
    };
  } else {
    snake.pop();
  }
}

function draw() {
  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Snake
  ctx.fillStyle = "#7a2cff";
  snake.forEach(part => {
    ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
  });

  // Food
  ctx.fillStyle = "lime";
  ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
}

function endGame() {
  gameRunning = false;

  document.getElementById("overlay").style.display = "flex";
  document.getElementById("message").innerHTML =
    "Game Over<br>Score: " + score + "<br><br>Press Start to play again";
}

document.addEventListener("keydown", e => {
  if (!gameRunning) return;

  const key = e.key.toLowerCase();

  // Prevent reverse
  if ((key === "arrowup" || key === "w") && dy !== 1) {
    dx = 0; dy = -1;
  } else if ((key === "arrowdown" || key === "s") && dy !== -1) {
    dx = 0; dy = 1;
  } else if ((key === "arrowleft" || key === "a") && dx !== 1) {
    dx = -1; dy = 0;
  } else if ((key === "arrowright" || key === "d") && dx !== -1) {
    dx = 1; dy = 0;
  }
});

gameLoop();
</script>

</body>
</html>
